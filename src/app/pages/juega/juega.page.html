<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Juega</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="juego-content ion-padding">
  <div class="contenedor-juego">
    <div class="info-juego">
      <div class="info-texto">
        <ion-text color="azul">Movimientos: {{ movimientos }}</ion-text>
        <ion-text color="azul">Parejas: {{ parejasEncontradas }}/3</ion-text>
      </div>
      <div class="reiniciar-landscape">
        <ion-button expand="block" (click)="iniciarJuego()" color="naranjadaruma" class="btn-reiniciar">
          Reiniciar
        </ion-button>
      </div>
    </div>

    <div class="tablero">
      <div 
        class="carta" 
        [class.revelada]="carta.revelada || carta.encontrada"
        [class.encontrada]="carta.encontrada"
        (click)="voltearCarta(carta)"
        *ngFor="let carta of cartas">
        
        <div class="carta-inner">
          <div class="carta-frente">
            <img src="./assets/imgs/LogoKoiCT.png" alt="LogoKoiCT">
          </div>
          <div class="carta-detras" [class]="carta.color">
            <img [src]="rutaImagenes + carta.imagen" [alt]="carta.imagen">
          </div>
        </div>
      </div>
    </div>

    <div class="reiniciar-portrait">
      <ion-button expand="block" (click)="iniciarJuego()" color="naranjadaruma" class="btn-reiniciar">
        <ion-icon name="refresh-outline"></ion-icon>
        Reiniciar Juego
      </ion-button>
    </div>

    <div *ngIf="juegoCompletado" class="victoria">
      <ion-card>
        <ion-card-header>
          <ion-card-title color="success">¡Felicidades!</ion-card-title>
        </ion-card-header>
        <ion-card-content>
          <p>Encontraste todas las parejas en {{ movimientos }} movimientos.</p>
          <ion-button expand="block" (click)="iniciarJuego()">Jugar de nuevo</ion-button>
        </ion-card-content>
      </ion-card>
    </div>
  </div>
</ion-content>
<!-- Footer -->
<ion-footer class="footerColor ion-no-border" >
  <ion-grid class="ion-no-padding">
    <ion-row >
      <ion-col size="12">
        <div class="ion-text-center">
          <small>Powered by <b>Devstar Novatech.</b></small>
        </div>        
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-footer>
